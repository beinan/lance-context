# Set metadata.namespace and the binding's subject namespace for your cluster.
# No worker/master Pod eviction, deletion, exec, or deployment mutation rights.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lance-context-master
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lance-context-catchup
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lance-context-catchup
  namespace: default
subjects:
  - kind: ServiceAccount
    name: lance-context-master
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lance-context-catchup
