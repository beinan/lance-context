[package]
name = "lance-context-wal"
version = "0.6.7"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Independent Rust WAL experiments owned by lance-context"

[features]
runner = ["dep:anyhow", "dep:clap", "dep:libc", "dep:serde", "dep:serde_json", "dep:sha2"]
contract = ["dep:serde", "dep:sha2"]
arrow-contract = ["contract", "dep:arrow-schema", "arrow-schema/serde", "dep:serde_json"]
record = ["dep:bytes", "bytes/serde", "dep:serde", "dep:sha2", "dep:uuid"]
placement = ["dep:anyhow", "dep:serde", "dep:serde_json", "dep:sha2", "dep:uuid"]
admission = ["dep:anyhow", "dep:serde"]
ipc = ["dep:anyhow", "dep:arrow-array", "dep:arrow-buffer", "dep:arrow-ipc", "dep:arrow-schema", "dep:bytes"]
lab = ["ipc", "dep:clap", "dep:hdrhistogram", "dep:raft-engine", "dep:raft-proto", "dep:serde_json"]

[dependencies]
anyhow = { version = "1", optional = true }
arrow-array = { version = "58", optional = true }
arrow-buffer = { version = "58", optional = true }
arrow-ipc = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }
bytes = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
hdrhistogram = { version = "7", optional = true }
libc = { version = "0.2", optional = true }
raft-engine = { version = "=0.4.2", default-features = false, optional = true }
raft-proto = { version = "=0.7.0", optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
uuid = { version = "1", features = ["serde"], optional = true }

[dev-dependencies]
bincode = "1.3"
arrow-ipc = { version = "58", features = ["zstd"] }
tempfile = "3"

[[bin]]
name = "context-wal-runner"
path = "src/bin/runner.rs"
required-features = ["runner"]

[[bin]]
name = "context-wal-resource"
path = "src/bin/resource.rs"
required-features = ["runner"]

[[bin]]
name = "context-wal-lab"
path = "src/bin/lab.rs"
required-features = ["lab"]
